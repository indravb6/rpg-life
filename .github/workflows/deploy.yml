name: Deploy RPG Life

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_CRED }}
          script: |
            cd ~/rpg-life

            git pull origin main

            # Backend
            (
              cd service
              docker compose up -d --build
            ) &

            # Frontend
            (
              cd web
              npm ci
              npm run build
              pm2 reload rpg-life-client || pm2 start npm --name rpg-life-client -- start
              pm2 save
            ) &

            wait

            echo "Deployment completed successfully."
