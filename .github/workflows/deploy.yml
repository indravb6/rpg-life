name: Deploy RPG Life

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_CRED }}
          script: |
            set -e

            cd ~/rpg-life

            git pull origin main

            # Load NVM
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            # Backend
            (
              set -e
              cd ~/rpg-life/service
              docker compose up -d --build
            ) &
            BACKEND_PID=$!

            # Frontend
            (
              set -e
              cd ~/rpg-life/web
              npm ci
              npm run build
              pm2 reload rpg-life-client || pm2 start npm --name rpg-life-client -- start
              pm2 save
            ) &
            FRONTEND_PID=$!

            # Wait for both deployments
            wait $BACKEND_PID
            wait $FRONTEND_PID

            echo "Deployment completed successfully."
